# A self-hosted Bound Up. See docs/self-hosting.md.
#
#   docker compose up -d
#
# Then open it and sign up: the first account becomes the admin, and is let in
# without confirming its email, because there is no email yet. Set it up in
# Settings → Admin → Server settings, with the push contact address and, if
# you want Daydreams, the model providers' keys. The server makes its own auth
# secret and push keys and keeps them in the database volume.
services:
  bound-up:
    image: ghcr.io/secondfolder/bound-up:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # The address people type into their browser. Required behind a TLS
      # proxy: without it the server believes it is on plain http, and form
      # posts, sign-in and passkeys all fail its origin checks. Passkeys also
      # need https unless this is localhost.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # Behind a reverse proxy, uncomment so sign-in is rate limited per client
      # rather than per proxy. XFF_DEPTH is how many proxies are in front.
      # See docs/rate-limiting.md.
      # ADDRESS_HEADER: X-Forwarded-For
      # XFF_DEPTH: 1
      # TEMPORARY: settings from before they moved into the admin screen.
      # Read once, from an .env beside this file, to carry an existing server
      # over — its BETTER_AUTH_SECRET above all, which keeps everyone signed
      # in — and ignored after that; the admin screen says which are still
      # set. A new server needs none of them. See docs/temporary-code.md.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DAYDREAM_MODEL: ${DAYDREAM_MODEL:-}
      RUNWARE_AI_API_KEY: ${RUNWARE_AI_API_KEY:-}
      RUNWARE_AI_IMAGE_MODEL: ${RUNWARE_AI_IMAGE_MODEL:-}
      RUNWARE_AI_IMAGE_MODEL_ILLUSTRATED: ${RUNWARE_AI_IMAGE_MODEL_ILLUSTRATED:-}
    volumes:
      - bound-up-db:/data/db
      - bound-up-media:/data/media

volumes:
  bound-up-db:
  bound-up-media:
