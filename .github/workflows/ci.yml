# Every pull request and every push to main: the full test suite and, beside
# it, the Docker image built and put through the Playwright suite in four
# shards. On main only, if
# all of that passed, semantic-release works out the version from the
# conventional commits and publishes the image to GHCR under it, and then
# production on Cloudflare is migrated and deployed.
#
# See docs/self-hosting.md and docs/development.md. Production deploys only
# from here: Cloudflare's own builds are off for `main`, and still build every
# other branch as a Worker Preview.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the older run moot. Releases are never
# cancelled mid-publish, only queued, one at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  IMAGE: bound-up:ci

jobs:
  verify:
    name: Lint, types and unit/component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so commitlint can walk a PR's commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Commit messages are conventional
        if: github.event_name == 'pull_request'
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/playwright-browser
      - run: npm run lint
      - run: npm run check
      - run: npx vitest run

  # Not after `verify`: the two share nothing, and waiting cost every run the
  # three or four minutes `verify` takes. `release` still needs both.
  image:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          # Shared with the release job, which then builds nothing but the
          # labels and arm64's production dependencies.
          cache-from: type=gha
          # Written from main only. A pull request's entries can be read by
          # that pull request alone, but count against the same 10 GB as
          # main's and evict the layers every later run on main wants — and
          # the export was over two minutes of every run. A pull request
          # still reads main's.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,ignore-error=true' || '' }}
      - name: Volumes survive a restart; migrations apply once
        run: scripts/docker-smoke.sh "$IMAGE"
      # Handed to the e2e shards as a file, so every shard tests this exact
      # image rather than a rebuild of it.
      - run: docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.gz
          # Already gzipped.
          compression-level: 0
          retention-days: 1

  # The Playwright suite against the image, split across runners. On one it
  # was thirteen of the run's minutes, and it is CPU-bound: more workers on the
  # same runner do not make it faster. `fullyParallel` lets `--shard` split it
  # by test rather than by file.
  e2e:
    name: E2E suite against the image (${{ matrix.shard }}/4)
    needs: image
    runs-on: ubuntu-latest
    strategy:
      # Every shard's failures, not just the first one's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - run: gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load
      # Playwright itself runs on the host and drives the container.
      - run: npm ci
      - uses: ./.github/actions/playwright-browser
      - name: Playwright suite against the image
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          E2E_IMAGE: ${{ env.IMAGE }}
      - name: Keep traces of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  release:
    name: Version and publish
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Tag and GitHub Release.
      contents: write
      # Push to ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads every commit since the last tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # No QEMU: every stage that runs anything is built on the runner's own
      # platform (see the Dockerfile), and the arm64 image is assembled from
      # their output without executing a thing in it.
      - uses: docker/setup-buildx-action@v3
      # Puts ACTIONS_RUNTIME_TOKEN in the environment, so the `docker buildx`
      # in scripts/publish-image.sh can reach the same GHA cache as the image
      # job and only installs arm64's production dependencies afresh.
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After `release`, not merely after the tests, so the tag already exists
  # when vite-plugins/app-version.ts reads it: the settings page then shows
  # the release this commit is, and a red run deploys nothing rather than
  # four days of untested commits all calling themselves the next version.
  # A push that releases nothing (`chore:`, `docs:`) still deploys.
  deploy:
    name: Migrate and deploy to Cloudflare
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tag `release` just pushed, which the
          # version is worked out from. checkout puts `main` at this run's
          # commit, not at whatever has been pushed since.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Built before migrating, so a build that fails leaves production's
      # schema alone.
      - run: npm run build
      - run: npm run db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
