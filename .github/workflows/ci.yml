# Every pull request and every push to main: the full test suite, then the
# Docker image built and put through the Playwright suite. On main only, if
# all of that passed, semantic-release works out the version from the
# conventional commits and publishes the image to GHCR under it.
#
# See docs/self-hosting.md. Cloudflare's deploy-on-push is separate and
# unaffected: it builds the Workers target on its own.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the older run moot. Releases are never
# cancelled mid-publish, only queued, one at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  IMAGE: bound-up:ci

jobs:
  verify:
    name: Lint, types and unit/component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so commitlint can walk a PR's commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Commit messages are conventional
        if: github.event_name == 'pull_request'
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check
      - run: npx vitest run

  image:
    name: Docker image, smoke test and e2e suite
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          # Shared with the release job, so it rebuilds nothing but the labels.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Volumes survive a restart; migrations apply once
        run: scripts/docker-smoke.sh "$IMAGE"
      # Playwright itself runs on the host and drives the container.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright suite against the image
        run: npx playwright test
        env:
          E2E_IMAGE: ${{ env.IMAGE }}
      - name: Keep traces of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  release:
    name: Version and publish
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Tag and GitHub Release.
      contents: write
      # Push to ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads every commit since the last tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Puts ACTIONS_RUNTIME_TOKEN in the environment, so the `docker buildx`
      # in scripts/publish-image.sh can reach the same GHA cache as the image
      # job and only builds arm64 from scratch.
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
